name: Build APK Assinado

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Build web app
        env:
          VITE_GIST_ID: 2ef280e3330c2e01fc4144a47fb6e8a5
          VITE_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: npm run build

      - name: Capacitor add android
        run: npx cap add android

      - name: Capacitor sync Android
        run: npx cap sync android

      - name: Gerar ícones e splash com @capacitor/assets
        run: |
          npm install -g @capacitor/assets
          npx @capacitor/assets generate \
            --assetPath assets \
            --androidProject android \
            --iconBackgroundColor '#0f2d5e' \
            --iconBackgroundColorDark '#0f2d5e' \
            --splashBackgroundColor '#0f2d5e' \
            --splashBackgroundColorDark '#0f2d5e'

      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Configurar signing no build.gradle
        working-directory: android
        run: |
          cat >> app/build.gradle << 'GRADLE'

          android.signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

      - name: Build APK Release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "jusconsulta-tjsp-${VERSION}.apk"
          echo "APK_NAME=jusconsulta-tjsp-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload APK artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Criar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          name: "JusConsulta TJSP ${{ github.ref_name }}"
          body: |
            ## JusConsulta TJSP ${{ github.ref_name }}

            APK oficial assinado — gerado automaticamente via GitHub Actions + Capacitor.

            ### Instalação
            1. Baixe o arquivo `.apk` abaixo
            2. No Android: **Configurações → Segurança → Fontes desconhecidas** (habilitar)
            3. Abra o arquivo `.apk` e instale

            ### Funcionalidades
            - Busca por nome, CPF/CNPJ e número do processo
            - Consulta: 1º Grau, 2º Grau e Colégio Recursal
            - Modo busca rápida e completa
            - Partes, movimentações, petições e incidentes
            - Fallback para e-SAJ oficial
