name: Build APK Assinado

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Java (Android build) ───────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Android SDK ────────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Dependências npm ───────────────────────────────────────────────────
      - name: Instalar dependências
        run: npm ci

      # ── 6. Build web (Vite) ───────────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 7. Capacitor sync ─────────────────────────────────────────────────────
      - name: Capacitor sync Android
        run: npx cap sync android

      # ── 8. Decodificar Keystore do Secret ────────────────────────────────────
      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # ── 9. Configurar assinatura no gradle ───────────────────────────────────
      - name: Configurar signing no build.gradle
        run: |
          cat >> android/app/build.gradle << 'GRADLE'

          android {
            signingConfigs {
              release {
                storeFile file("release.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          GRADLE

      # ── 10. Build APK release ─────────────────────────────────────────────────
      - name: Build APK Release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      # ── 11. Renomear APK com versão ───────────────────────────────────────────
      - name: Renomear APK
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="dev-$(echo ${{ github.sha }} | head -c 7)"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk \
             jusconsulta-tjsp-${VERSION}.apk
          echo "APK_NAME=jusconsulta-tjsp-${VERSION}.apk" >> $GITHUB_ENV

      # ── 12. Upload APK como artefato ──────────────────────────────────────────
      - name: Upload APK artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      # ── 13. Criar Release (só em tags v*) ────────────────────────────────────
      - name: Criar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          name: "JusConsulta TJSP ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
