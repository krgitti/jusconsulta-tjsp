name: Build APK Assinado

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Java 17 ───────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Android SDK ────────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Dependências npm ───────────────────────────────────────────────────
      - name: Instalar dependências
        run: npm ci

      # ── 6. Build web (Vite) ───────────────────────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 7. Capacitor add android (gera pasta android/ fresh) ─────────────────
      - name: Capacitor add android
        run: npx cap add android

      # ── 8. Capacitor sync ─────────────────────────────────────────────────────
      - name: Capacitor sync Android
        run: npx cap sync android

      # ── 9. Decodificar Keystore ───────────────────────────────────────────────
      - name: Decodificar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      # ── 10. Configurar assinatura no build.gradle ─────────────────────────────
      - name: Configurar signing no build.gradle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Injeta bloco de signing no app/build.gradle
          cat >> app/build.gradle << 'GRADLE'

          android.signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          GRADLE

      # ── 11. Build APK release ─────────────────────────────────────────────────
      - name: Build APK Release
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 12. Renomear APK ──────────────────────────────────────────────────────
      - name: Renomear APK
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK_PATH" "jusconsulta-tjsp-${VERSION}.apk"
          echo "APK_NAME=jusconsulta-tjsp-${VERSION}.apk" >> $GITHUB_ENV

      # ── 13. Upload APK como artefato ──────────────────────────────────────────
      - name: Upload APK artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      # ── 14. GitHub Release (apenas em tags v*) ────────────────────────────────
      - name: Criar GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          name: "JusConsulta TJSP ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
