<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2d5e"/>
      <stop offset="100%" style="stop-color:#1a4a8a"/>
    </linearGradient>
    <!-- Gold gradient for scale -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="50%" style="stop-color:#f5c842"/>
      <stop offset="100%" style="stop-color:#d4a017"/>
    </linearGradient>
    <!-- Gold gradient for magnifier -->
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#c8950e"/>
    </linearGradient>
    <!-- Subtle inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" style="stop-color:#1e5da0;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0a1f3f;stop-opacity:0"/>
    </radialGradient>
    <!-- Drop shadow for scale -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Glow for magnifier -->
    <filter id="magGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#f5c842" flood-opacity="0.35"/>
    </filter>
    <!-- Clip path for rounded corners -->
    <clipPath id="roundedRect">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>
  <!-- Inner glow overlay -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#innerGlow)"/>

  <!-- Subtle grid lines for texture -->
  <g clip-path="url(#roundedRect)" opacity="0.04">
    <line x1="0" y1="128" x2="512" y2="128" stroke="white" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="white" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="white" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="white" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="white" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="white" stroke-width="1"/>
  </g>

  <!-- ======== SCALE / BALANÇA ======== -->
  <g filter="url(#shadow)">
    <!-- Central pillar (vertical bar) -->
    <rect x="248" y="82" width="16" height="238" rx="8" fill="url(#goldGrad)"/>

    <!-- Top ornament circle -->
    <circle cx="256" cy="78" r="18" fill="url(#goldGrad)"/>
    <circle cx="256" cy="78" r="10" fill="#0f2d5e"/>
    <circle cx="256" cy="78" r="5" fill="url(#goldGrad)"/>

    <!-- Horizontal beam -->
    <rect x="126" y="112" width="260" height="14" rx="7" fill="url(#goldGrad)"/>

    <!-- Left chain -->
    <line x1="148" y1="126" x2="148" y2="178" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="5,4"/>
    <!-- Right chain -->
    <line x1="364" y1="126" x2="364" y2="178" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="5,4"/>

    <!-- Left pan -->
    <ellipse cx="148" cy="192" rx="52" ry="10" fill="url(#goldGrad)"/>
    <path d="M100,182 Q148,220 196,182" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Right pan (slightly lower — justice not yet served!) -->
    <ellipse cx="364" cy="198" rx="52" ry="10" fill="url(#goldGrad)"/>
    <path d="M316,188 Q364,226 412,188" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>

    <!-- Base pedestal -->
    <rect x="236" y="316" width="40" height="12" rx="6" fill="url(#goldGrad)"/>
    <rect x="210" y="326" width="92" height="10" rx="5" fill="url(#goldGrad)"/>
    <rect x="196" y="334" width="120" height="8" rx="4" fill="url(#goldGrad)"/>
  </g>

  <!-- ======== MAGNIFIER (lupa) — bottom right, integrated ======== -->
  <g filter="url(#magGlow)" transform="translate(288, 240)">
    <!-- Magnifier circle ring -->
    <circle cx="72" cy="72" r="52" fill="none" stroke="url(#goldGrad2)" stroke-width="13"/>
    <!-- Magnifier lens inner (glass) -->
    <circle cx="72" cy="72" r="39" fill="#1a4a8a" fill-opacity="0.55"/>
    <!-- Lens shine -->
    <ellipse cx="60" cy="60" rx="14" ry="9" fill="white" fill-opacity="0.12" transform="rotate(-30,60,60)"/>
    <!-- Handle -->
    <line x1="112" y1="112" x2="148" y2="148" stroke="url(#goldGrad2)" stroke-width="16" stroke-linecap="round"/>
    <!-- Small scale icon inside lens hint -->
    <line x1="62" y1="56" x2="82" y2="56" stroke="#f5c842" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="72" y1="50" x2="72" y2="89" stroke="#f5c842" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="55" y1="66" x2="68" y2="79" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="89" y1="66" x2="76" y2="79" stroke="#f5c842" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ======== TEXT ======== -->
  <!-- "JUS" - large serif -->
  <text x="256" y="412"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="82"
    font-weight="700"
    fill="url(#goldGrad)"
    text-anchor="middle"
    letter-spacing="8">JUS</text>

  <!-- "CONSULTA · TJSP" - small caps style -->
  <text x="256" y="452"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="24"
    font-weight="400"
    fill="#93c5fd"
    text-anchor="middle"
    letter-spacing="4">CONSULTA · TJSP</text>

  <!-- Thin gold separator line above text -->
  <line x1="172" y1="390" x2="340" y2="390" stroke="#f5c842" stroke-width="1.5" opacity="0.5"/>
</svg>
